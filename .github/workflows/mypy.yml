name: Static contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  strict-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.1
          poetry install --with dev --no-interaction

      - name: Strict mypy over source, examples, and contract tests
        run: |
          mapfile -t good_fixtures < <(
            {
              find tests/typecheck -name '*_good.py' -print
              find tests/browsers/unit -name 'typecheck_*.py' -print
            } | sort
          )
          poetry run mypy \
            --strict \
            --python-version "${{ matrix.python-version }}" \
            src examples \
            tests/typecheck/check_bad_fixtures.py \
            tests/packaging/check_installed_wheel_types.py \
            tests/packaging/installed_wheel_smoke.py \
            tests/policies/test_policies.py \
            tests/browsers/integration/playwright/test_action_concurrency.py \
            "${good_fixtures[@]}"

      - name: Strict Pyright over source, examples, and contract tests
        run: poetry run pyright --pythonversion "${{ matrix.python-version }}"

      - name: Strict Pyright over gate implementations
        run: |
          poetry run pyright \
            --pythonversion "${{ matrix.python-version }}" \
            tests/typecheck/check_bad_fixtures.py \
            tests/packaging/check_installed_wheel_types.py \
            tests/packaging/installed_wheel_smoke.py

      - name: Negative fixtures emit their intended checker diagnostics
        run: >-
          poetry run python tests/typecheck/check_bad_fixtures.py
          --python-version "${{ matrix.python-version }}"
