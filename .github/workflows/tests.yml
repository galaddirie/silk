name: Runtime and browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-browser-external:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.1
          poetry install --with dev --no-interaction

      - name: Install Chromium and operating-system dependencies
        run: poetry run playwright install --with-deps chromium

      - name: Run runtime tests
        run: |
          poetry run python -m pytest \
            tests/actions \
            tests/browsers/unit \
            tests/policies \
            tests/selectors \
            -v

      - name: Run live browser integration tests
        run: poetry run python -m pytest tests/browsers/integration/playwright -v

      - name: Run real Books to Scrape public pipeline without skipping
        run: poetry run python -m pytest tests/examples/test_books_to_scrape.py -v
