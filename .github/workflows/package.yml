name: Package contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-installed-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.1
          poetry install --with dev --no-interaction

      - name: Verify project metadata and lock consistency
        run: poetry check --lock --strict

      - name: Clean-build exactly one sdist and one wheel
        run: |
          poetry build --clean
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#sdists[@]}" -eq 1
          test "${#wheels[@]}" -eq 1

      - name: Strict type-check copied consumers against the installed wheel
        run: |
          wheel_path=$(realpath "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)")
          poetry run python tests/packaging/check_installed_wheel_types.py "$wheel_path"

      - name: Smoke isolated installed wheel outside the checkout
        run: |
          wheel_path=$(realpath "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)")
          smoke_dir=$(mktemp -d)
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install "$wheel_path"
          "$smoke_dir/venv/bin/python" -m playwright install --with-deps chromium
          cp tests/packaging/installed_wheel_smoke.py "$smoke_dir/smoke.py"
          (
            cd "$smoke_dir"
            SILK_CHECKOUT="$GITHUB_WORKSPACE" "$smoke_dir/venv/bin/python" smoke.py
          )

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: silk-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
