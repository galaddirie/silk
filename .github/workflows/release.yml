name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.4.1)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.1
          poetry install --with dev --no-interaction

      - name: Update and validate package version contracts
        run: |
          poetry run python scripts/update_version.py "$RELEASE_VERSION"
          poetry lock
          poetry check --lock --strict

      - name: Date the release notes and open the next unreleased section
        run: |
          poetry run python - <<'PY'
          from datetime import date
          import os
          from pathlib import Path
          import re

          version = os.environ["RELEASE_VERSION"]
          path = Path("CHANGELOG.md")
          content = path.read_text(encoding="utf-8")
          dated_heading = f"## [{version}] - {date.today().isoformat()}"
          unreleased = re.compile(r"^## \[Unreleased\].*$", re.MULTILINE)
          existing = re.compile(
              rf"^## \[{re.escape(version)}\].*$",
              re.MULTILINE,
          )
          if unreleased.search(content):
              content = unreleased.sub(dated_heading, content, count=1)
          elif existing.search(content):
              content = existing.sub(dated_heading, content, count=1)
          else:
              raise SystemExit(
                  f"CHANGELOG.md has neither Unreleased nor {version} notes"
              )

          next_section = (
              "## [Unreleased]\n\n"
              "### Added\n\n"
              "### Fixed\n\n"
              "### Changed\n"
          )
          content = content.replace(
              "# Changelog\n",
              f"# Changelog\n\n{next_section}",
              1,
          )
          path.write_text(content, encoding="utf-8")
          PY

      - name: Extract release notes
        run: |
          poetry run python scripts/extract_changelog.py "$RELEASE_VERSION" \
            > changelog_extract.md

      - name: Commit version changes
        id: version-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: prepare release v${{ inputs.version }}"
          file_pattern: >-
            pyproject.toml poetry.lock src/silk/__init__.py
            tests/packaging/installed_wheel_smoke.py CHANGELOG.md

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Version ${{ inputs.version }}
          target_commitish: ${{ steps.version-commit.outputs.commit_hash }}
          draft: true
          generate_release_notes: false
          body_path: changelog_extract.md
