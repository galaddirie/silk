name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    uses: ./.github/workflows/package.yml

  publish-verified-package:
    needs: verify-package
    runs-on: ubuntu-latest
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: silk-distributions
          path: dist

      - name: Require exactly one verified sdist and wheel
        run: |
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#sdists[@]}" -eq 1
          test "${#wheels[@]}" -eq 1

      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
