[project]
name = "silk-scraper"
version = "0.4.1"
description = "Typed Playwright browser automation built on FP-Ops unary pipelines"
authors = [
    {name = "Galad Dirie", email = "hello@galad.ca"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fp-ops (>=0.5.0,<0.6.0)",
    "playwright (>=1.61.0,<2.0.0)",
    "typing-extensions (>=4.12.0,<5.0.0)",
]

[project.optional-dependencies]
httpx = ["httpx (>=0.27,<1.0)"]
static = ["lxml (>=5.2,<7.0)", "cssselect (>=1.2,<2.0)"]

[project.urls]
"Homepage" = "https://github.com/galaddirie/silk"
"Bug Tracker" = "https://github.com/galaddirie/silk/issues"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.1"
mypy = "^1.15.0"
pyright = "1.1.411"
black = "25.1.0"
pre-commit = "4.2.0"
httpx = ">=0.27,<1.0"
isort = ">=6.0.1"
lxml = ">=5.2"
cssselect = ">=1.2"
types-lxml = ">=2025.3"

[tool.poetry]
packages = [
    {include = "silk", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src",
    "examples",
    "tests/browsers/unit/typecheck_*.py",
    "tests/browsers/integration/playwright/test_action_concurrency.py",
    "tests/policies/test_policies.py",
    "tests/typecheck/*_good.py",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
    "src",
    "examples",
    "tests/browsers/unit/typecheck_*.py",
    "tests/browsers/integration/playwright/test_action_concurrency.py",
    "tests/policies/test_policies.py",
    "tests/typecheck/*_good.py",
]
